<!DOCTYPE html>

    <!-- Tailwind CSS -->

    <!-- FontAwesome Icons (Reemplazo para compatibilidad en GitHub Pages sin node_modules) -->

    <!-- React & ReactDOM -->

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Compilador de React en el navegador) -->

    <style>

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0C10;
            color: #FFFFFF;
            overflow-x: hidden;
        }
        
        .font-serif { font-family: 'Cinzel', serif; }
        
        /* Animaciones elegantes */
        .fadeIn { animation: fadeIn 0.8s ease-out forwards; }
        .slideDown { animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Scrollbars customizados y premium */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050608; }
        ::-webkit-scrollbar-thumb { background: #1F2833; border-radius: 4px; }

</head>
<body class="selection:bg-[#D4AF37] selection:text-[#0B0C10]">
    
    <!-- Contenedor Principal donde React renderizará la web -->
    <div id="root"></div>

    <!-- Script Principal de React (JSX) -->

        // --- CONFIGURACIÓN DE ACTIVOS Y DATOS ---

            logoVertical: "https://raw.githubusercontent.com/direccioncomercial/CIMAJ/main/CIMAJ%200825%20Logotipo%20V%20Blanco.png",

            entrevista: "https://raw.githubusercontent.com/direccioncomercial/CIMAJ/main/entrevista.jpg",
            revista: "https://raw.githubusercontent.com/direccioncomercial/CIMAJ/main/revista%20cimaj.pdf",
            team: {
                carlos: "https://raw.githubusercontent.com/direccioncomercial/CIMAJ/main/foto%20charlie.jpg",

                { title: "Video Corporativo 3", url: "https://vt.tiktok.com/ZSxPeA5gR/" }
            ]

        const SOCIAL_LINKS = {
            tiktok: "https://www.tiktok.com/@cimaj.ecuador?_r=1&_t=ZS-96agnjSJRzR",
            instagram: "https://www.instagram.com/cimaj_ecuador?igsh=MTA2aTQwMHh2aXBwbQ==",
            facebook: "https://www.facebook.com/share/14gDs7LmGvP/",
            whatsapp: "https://wa.me/593998877398",
            callcenter: "tel:0999367562"

        // Icono Vectorial para TikTok
        const TikTokIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className} xmlns="http://www.w3.org/2000/svg">

        );

        // --- COMPONENTE HEADER ---

            const [isMobileOpen, setIsMobileOpen] = useState(false);
            const [activeDropdown, setActiveDropdown] = useState(null);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);

            const handleNav = (viewName) => {

                setIsMobileOpen(false);

                            <a href={SOCIAL_LINKS.facebook} target="_blank" rel="noreferrer" className="hover:text-[#D4AF37] transition-colors"><i className="fa-brands fa-facebook-f text-base"></i></a>
                            <a href={SOCIAL_LINKS.instagram} target="_blank" rel="noreferrer" className="hover:text-[#D4AF37] transition-colors"><i className="fa-brands fa-instagram text-base"></i></a>

                                            <button onClick={() => handleNav('equipo')} className="w-full text-left px-5 py-3 text-sm text-[#C5C6C7] hover:text-[#D4AF37] hover:bg-[#1F2833]/30 transition-all">Nuestro Equipo</button>

                                    <button onClick={() => toggleDropdown('medios')} className={`flex items-center text-sm uppercase tracking-widest font-medium transition-colors ${(currentView === 'revista' || currentView === 'multimedia') ? 'text-[#D4AF37] drop-shadow-[0_0_8px_rgba(212,175,55,0.5)]' : 'text-[#C5C6C7] hover:text-white'}`}>

                                    {activeDropdown === 'medios' && (

                                <button onClick={() => handleNav('servicios')} className="block w-full text-left px-4 py-4 text-[#C5C6C7] border-b border-[#1F2833]/50 uppercase text-xs tracking-widest font-bold hover:text-[#D4AF37] hover:bg-[#111216]/50 transition-colors">Servicios</button>
                                <button onClick={() => handleNav('revista')} className="block w-full text-left px-4 py-4 text-[#C5C6C7] border-b border-[#1F2833]/50 uppercase text-xs tracking-widest font-bold hover:text-[#D4AF37] hover:bg-[#111216]/50 transition-colors">Revista Institucional</button>
                                <button onClick={() => handleNav('multimedia')} className="block w-full text-left px-4 py-4 text-[#C5C6C7] border-b border-[#1F2833]/50 uppercase text-xs tracking-widest font-bold hover:text-[#D4AF37] hover:bg-[#111216]/50 transition-colors">Multimedia y Videos</button>
                                
                                <div className="pt-6 px-2">
                                    <a href={SOCIAL_LINKS.whatsapp} className="flex justify-center items-center w-full bg-gradient-to-r from-[#D4AF37] to-[#AA8C3F] text-[#0B0C10] px-6 py-4 rounded-xl font-bold uppercase text-xs tracking-widest shadow-[0_0_20px_rgba(212,175,55,0.3)] hover:scale-[1.02] transition-transform">

                                    <a href={SOCIAL_LINKS.facebook} className="text-[#C5C6C7] hover:text-[#D4AF37]"><i className="fa-brands fa-facebook-f text-2xl"></i></a>
                                    <a href={SOCIAL_LINKS.instagram} className="text-[#C5C6C7] hover:text-[#D4AF37]"><i className="fa-brands fa-instagram text-2xl"></i></a>

        // --- COMPONENTE VISTA INICIO ---
        const ViewHome = ({ setView }) => (

                            <div className="flex flex-col sm:flex-row gap-6">
                                <button onClick={() => setView('servicios')} className="flex items-center justify-center bg-gradient-to-r from-[#D4AF37] to-[#AA8C3F] text-[#0B0C10] px-8 py-4 rounded-sm hover:from-[#E5C158] hover:to-[#BFA054] transition-all duration-300 font-bold uppercase tracking-widest text-sm shadow-lg">
                                    Explorar Servicios
                                </button>
                                <a href={SOCIAL_LINKS.whatsapp} target="_blank" rel="noreferrer" className="flex items-center justify-center border border-[#D4AF37]/50 text-white px-8 py-4 rounded-sm hover:bg-[#D4AF37]/10 hover:border-[#D4AF37] transition-all duration-300 font-medium uppercase tracking-widest text-sm backdrop-blur-sm">

                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div className="bg-[#111216] border-y border-[#1F2833] py-16">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
                            <div className="p-6">
                                <i className="fa-solid fa-landmark text-4xl mx-auto text-[#D4AF37] mb-4 block"></i>
                                <h3 className="text-white font-serif text-xl font-bold mb-2">Defensa Integral</h3>

        // --- COMPONENTE VISTA HISTORIA ---
        const ViewHistoria = () => (
            <div className="pt-32 pb-24 bg-[#0B0C10] min-h-screen fadeIn relative overflow-hidden">
                <div className="absolute top-0 left-1/2 transform -translate-x-1/2 w-full max-w-4xl h-96 bg-[#D4AF37] opacity-[0.03] blur-[120px] pointer-events-none"></div>

                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                    <div className="text-center mb-16">
                        <h3 className="text-[#D4AF37] text-sm uppercase tracking-[0.3em] font-bold mb-4">Nuestra Identidad</h3>
                        <h2 className="text-4xl md:text-5xl text-white font-serif font-bold">Un compromiso con la excelencia</h2>
                    </div>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center mb-24">
                        <div className="relative group">
                            <div className="absolute inset-0 bg-gradient-to-tr from-[#D4AF37] to-transparent transform translate-x-4 translate-y-4 opacity-20 transition-transform group-hover:translate-x-6 group-hover:translate-y-6 duration-500 rounded-lg"></div>

                            <h4 className="text-white font-serif font-bold text-lg mb-4 border-b border-[#1F2833] pb-2 inline-block">Navegación</h4>
                            <ul className="space-y-2 text-sm text-[#C5C6C7]">
                                <li><button onClick={() => { setView('home'); window.scrollTo(0,0); }} className="hover:text-[#D4AF37] transition-colors">Inicio</button></li>
                                <li><button onClick={() => { setView('revista'); window.scrollTo(0,0); }} className="hover:text-[#D4AF37] transition-colors">Revista Oficial</button></li>
                            </ul>
                        </div>

                    </div>

                    <div className="border-t border-[#1F2833] pt-8 flex flex-col md:flex-row justify-between items-center text-xs text-[#5A6066] font-light">
                        <p>&copy; {new Date().getFullYear()} CIMAJ Corporación Legal. Todos los derechos reservados.</p>
                        <div className="space-x-6 mt-4 md:mt-0">
                            <a href="#" className="hover:text-[#C5C6C7] transition-colors">Política de Privacidad</a>
                            <a href="#" className="hover:text-[#C5C6C7] transition-colors">Términos de Servicio</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        // --- APP PRINCIPAL ---
        const App = () => {
            const [currentView, setCurrentView] = useState('home');

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <Header currentView={currentView} setView={setCurrentView} />
                    
                    <main className="flex-grow">
                        {currentView === 'home' && <ViewHome setView={setCurrentView} />}
                        {currentView === 'historia' && <ViewHistoria />}
                        {currentView === 'equipo' && <ViewEquipo />}
                        {currentView === 'servicios' && <ViewServicios />}
                        {currentView === 'revista' && <ViewRevista />}
                        {currentView === 'multimedia' && <ViewMultimedia />}
                    </main>
                    
                    <Footer setView={setCurrentView} />
                </div>
            );
        };

        // RENDERIZAR EN EL DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
